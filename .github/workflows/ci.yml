name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  frontend-build-and-test:
    name: Frontend Lint, Typecheck, Test, Build & E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (clean npm ci)
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Run Unit Tests (Vitest)
        run: npm run test

      - name: Build Next.js 16 Application
        run: npm run build

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Smoke Tests
        run: npm run test:e2e

      - name: Upload Playwright Artifacts & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/tests/e2e/screenshots/
          retention-days: 14

  backend-lint-and-test:
    name: Backend Lint, Formatting & Pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies for Open3D & OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libgomp1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Ruff Formatting Check
        run: ruff format --check .

      - name: Run Pytest Suite
        run: pytest -v
