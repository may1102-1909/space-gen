name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  frontend-build-and-test:
    name: Frontend Lint, Typecheck, Test, Build & E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (clean npm ci)
        run: npm ci

      # Playwright starts the real FastAPI backend (uvicorn, temp DATA_DIR) for the e2e specs.
      - name: Set up Python 3.11 (e2e backend)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies (e2e backend)
        working-directory: backend
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libgomp1
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Run Unit Tests (Vitest)
        run: npm run test

      - name: Build Next.js 16 Application
        run: npm run build

      # The e2e build enables the NEXT_PUBLIC_E2E test hooks and points the client at the e2e backend.
      - name: Build Next.js 16 Application for E2E
        run: npm run build:e2e

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      # Runners have no GPU: Chromium uses SwiftShader (the editor renders ~1 fps), hence the long timeout.
      - name: Run Playwright E2E (incl. T09 Phase 1 loop against the real backend)
        run: npm run test:e2e
        timeout-minutes: 40
        env:
          E2E_SOFTWARE_GL: '1'

      - name: Upload Playwright Artifacts, Screenshots & Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  backend-lint-and-test:
    name: Backend Lint, Formatting & Pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies for Open3D & OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libgomp1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Ruff Formatting Check
        run: ruff format --check .

      - name: Run Pytest Suite
        run: pytest -v

  contracts-schema-drift-check:
    name: Contracts Parity & Schema Drift Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Verify Contracts Schema Parity & Zero Drift
        run: python scripts/check_contracts_sync.py

